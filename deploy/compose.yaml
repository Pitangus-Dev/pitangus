# Tamandua in one file: published images, nothing to clone or build, no Docker socket.
# Generated by scripts/standalone-compose.py from the repository's files: edit those and run `make standalone`.
#
#   1. Put this file on the server, or paste it into Coolify, Dokploy, Portainer or Hostinger's Docker manager.
#   2. Set the variables (a .env next to this file, or the platform's environment screen):
#        TAMANDUA_DB_PASSWORD   openssl rand -hex 24
#        TAMANDUA_MASTER_KEY    openssl rand -base64 32   (keep a copy apart: it decrypts every stored secret)
#        TAMANDUA_PUBLIC_URL    https://tamandua.example.com
#   3. docker compose up -d
#      With your own domain and no proxy in front: docker compose --profile https up -d (Caddy gets the certificate).
#      Scheduled backups into ./backups: add --profile backup.
#   4. The first administrator's code: docker compose exec api python -m tamandua setup-code
#
# The worker runs the analysis engines inside its own image (TAMANDUA_ENGINE_RUNNER=local): nothing in this file
# touches the host's Docker. Guide: docs/deploy.md
name: tamandua

x-app: &app
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:size=256m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-env: &env
  TAMANDUA_DATABASE_URL: "postgresql+psycopg://tamandua:${TAMANDUA_DB_PASSWORD:?set TAMANDUA_DB_PASSWORD (openssl rand -hex 24)}@postgres:5432/tamandua"
  TAMANDUA_MASTER_KEY: "${TAMANDUA_MASTER_KEY:?set TAMANDUA_MASTER_KEY (openssl rand -base64 32)}"
  TAMANDUA_PUBLIC_URL: "${TAMANDUA_PUBLIC_URL:?set TAMANDUA_PUBLIC_URL (https://your-domain)}"
  TAMANDUA_ALLOWED_ORIGINS: "${TAMANDUA_ALLOWED_ORIGINS:-${TAMANDUA_PUBLIC_URL}}"
  # The API is reached through a proxy (Caddy below, or the platform's): its X-Forwarded-For is believed.
  TAMANDUA_FORWARDED_ALLOW_IPS: "${TAMANDUA_FORWARDED_ALLOW_IPS:-*}"
  TAMANDUA_DEFAULT_LOCALE: "${TAMANDUA_DEFAULT_LOCALE:-en}"
  TAMANDUA_REQUIRE_TOTP: "${TAMANDUA_REQUIRE_TOTP:-admins}"
  TAMANDUA_METRICS_TOKEN: "${TAMANDUA_METRICS_TOKEN:-}"
  # CI importing SARIF through POST /api/ci/sarif. Empty = off.
  TAMANDUA_IMPORT_TOKEN: "${TAMANDUA_IMPORT_TOKEN:-}"
  TAMANDUA_NVD_API_KEY: "${TAMANDUA_NVD_API_KEY:-}"
  TAMANDUA_LOG_FORMAT: "${TAMANDUA_LOG_FORMAT:-text}"
  # leader: the leader worker runs the periodic tasks. external: a scheduler calls GET /api/cron with this token.
  TAMANDUA_PERIODIC: "${TAMANDUA_PERIODIC:-leader}"
  TAMANDUA_CRON_TOKEN: "${TAMANDUA_CRON_TOKEN:-}"
  TAMANDUA_DATA_DIR: /data

services:
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: tamandua
      POSTGRES_DB: tamandua
      POSTGRES_PASSWORD: "${TAMANDUA_DB_PASSWORD:?set TAMANDUA_DB_PASSWORD}"
    volumes:
      - tamandua-pg:/var/lib/postgresql
    # The entrypoint starts as root to own the data folder, then drops to the postgres user: only what that takes.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    networks:
      - db
    shm_size: 128mb
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tamandua -d tamandua"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    <<: *app
    image: "${TAMANDUA_IMAGE:-ghcr.io/tamandua-appsec/tamandua}:${TAMANDUA_VERSION:-0.11}"
    environment:
      <<: *env
      TAMANDUA_EMBEDDED_WORKER: "0"
    volumes:
      - tamandua-data:/data
    networks:
      - default
      - db
      - edge
    # This machine only: a proxy (Caddy below, or the platform's) publishes it with HTTPS.
    ports:
      - "${TAMANDUA_PORT:-127.0.0.1:8766}:8766"
    # Ceilings so a runaway process can't starve the host (and Postgres with it).
    mem_limit: ${TAMANDUA_API_MEMORY:-1g}
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,urllib.parse as p,urllib.request as r; h=p.urlsplit(os.environ['TAMANDUA_ALLOWED_ORIGINS'].split(',')[0].strip()).netloc; sys.exit(0 if r.urlopen(r.Request('http://127.0.0.1:8766/api/health', headers={'Host': h}), timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *app
    image: "${TAMANDUA_IMAGE:-ghcr.io/tamandua-appsec/tamandua}-worker:${TAMANDUA_VERSION:-0.11}"
    environment:
      <<: *env
      # Engines write their temporary files (image layers, databases) to disk, not to the small in-memory /tmp.
      TMPDIR: /data/tmp
    volumes:
      - tamandua-data:/data
    networks:
      - default
      - db
    # The engines run inside this container here: it needs more room than the API, still capped.
    mem_limit: ${TAMANDUA_WORKER_MEMORY:-4g}
    pids_limit: 1024

  caddy:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    profiles: [https]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      TAMANDUA_PUBLIC_URL: "${TAMANDUA_PUBLIC_URL:?set TAMANDUA_PUBLIC_URL}"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    # Only the api: PostgreSQL and the worker aren't on this network.
    networks:
      - edge
    depends_on:
      api:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  backup:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    profiles: [backup]
    init: true
    user: "10001:10001"
    entrypoint: ["/bin/sh", "/opt/tamandua/backup-service.sh"]
    environment:
      PGHOST: postgres
      PGUSER: tamandua
      PGDATABASE: tamandua
      PGPASSWORD: "${TAMANDUA_DB_PASSWORD:?set TAMANDUA_DB_PASSWORD}"
      BACKUP_INTERVAL_HOURS: "${TAMANDUA_BACKUP_INTERVAL_HOURS:-24}"
      BACKUP_KEEP_DAYS: "${TAMANDUA_BACKUP_KEEP_DAYS:-14}"
      BACKUP_AGE_RECIPIENT: "${TAMANDUA_BACKUP_AGE_RECIPIENT:-}"
    configs:
      - source: backup
        target: /opt/tamandua/backup-service.sh
    volumes:
      - tamandua-data:/source/data:ro
      - ${TAMANDUA_BACKUP_DIR:-./backups}:/backups
    networks:
      - db
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

configs:
  caddyfile:
    content: |
      # Caddy in front of Tamandua (deploy/compose.yaml). Automatic HTTPS for TAMANDUA_PUBLIC_URL: certificate from
      # Let's Encrypt (ZeroSSL as fallback), renewed on its own, and HTTP redirected to HTTPS.
      # The app sets the security headers (CSP, HSTS, nosniff, frame, referrer): none are repeated here.
      {
      	servers {
      		timeouts {
      			read_header 10s
      			# Request bodies are small (the app accepts at most 1 MB).
      			read_body 30s
      			# Long enough for the largest PDF or export.
      			write 5m
      			idle 2m
      		}
      	}
      }

      {$$TAMANDUA_PUBLIC_URL} {
      	# Above the app's own limit (1 MB), which answers with a precise error; this only stops abuse earlier.
      	request_body {
      		max_size 2MB
      	}

      	# Only the panel's static files: API responses are not compressed (they can carry secrets next to
      	# user-controlled text, which is what compression side channels need).
      	@assets path /assets/*
      	encode @assets zstd gzip

      	reverse_proxy api:8766 {
      		transport http {
      			dial_timeout 5s
      			response_header_timeout 5m
      			# Below the app's keep-alive (5 s): Caddy never reuses a connection the app is about to close.
      			keepalive 4s
      		}
      	}

      	# Don't advertise the proxy software.
      	header {
      		-Server
      		-Via
      	}

      	# Access log to stdout (rotated by Docker). Caddy redacts Cookie and Authorization.
      	log {
      		output stdout
      		format json
      	}
      }
  backup:
    content: |
      #!/bin/sh
      # Scheduled backups inside the `backup` service (compose profile `backup`); not meant to be run on the host.
      # Every BACKUP_INTERVAL_HOURS: /backups/auto-<date>/ with database.dump (pg_dump -Fc) and data.tgz (the same layout as
      # `make backup`), written to a hidden folder first and renamed when complete. Deletes its own auto-* folders older
      # than BACKUP_KEEP_DAYS; manual backups are never touched.
      # The master key never sits unencrypted next to the secrets it opens: without BACKUP_AGE_RECIPIENT it stays out
      # (master-key.sha256 names the key the backup needs); with it (age1… or ssh-ed25519 …, comma-separated), every file
      # is encrypted with age (*.age) and config.tgz, with the key, goes in too. Needs an image with age
      # (compose.backup-age.yaml).
      #   --check   exit 0 if the newest complete backup is younger than two intervals (the container healthcheck)
      set -eu

      interval=$${BACKUP_INTERVAL_HOURS:-24}
      keep=$${BACKUP_KEEP_DAYS:-14}
      case "$$interval$$keep" in *[!0-9]*|'') echo "BACKUP_INTERVAL_HOURS and BACKUP_KEEP_DAYS must be whole numbers" >&2; exit 2 ;; esac
      [ "$$interval" -ge 1 ] || { echo "BACKUP_INTERVAL_HOURS must be at least 1" >&2; exit 2; }

      if [ "$${1:-}" = "--check" ]; then
        recent=$$(find /backups -mindepth 1 -maxdepth 1 -type d -name 'auto-*' -mmin -$$((interval * 120)) | head -n1)
        [ -n "$$recent" ]
        exit $$?
      fi

      # The age arguments (-r <recipient>…) become the positional parameters passed to backup().
      set --
      if [ -n "$${BACKUP_AGE_RECIPIENT:-}" ]; then
        command -v age >/dev/null || { echo "TAMANDUA_BACKUP_AGE_RECIPIENT is set but this image has no age: add compose.backup-age.yaml to COMPOSE_FILE in .env and run make up." >&2; exit 2; }
        set -f; old_ifs=$$IFS; IFS=,
        for recipient in $$BACKUP_AGE_RECIPIENT; do
          recipient=$$(printf '%s' "$$recipient" | sed 's/^[[:space:]]*//; s/[[:space:]]*$$//')
          [ -z "$$recipient" ] || set -- "$$@" -r "$$recipient"
        done
        IFS=$$old_ifs; set +f
        [ $$# -gt 0 ] && printf '' | age "$$@" >/dev/null || { echo "TAMANDUA_BACKUP_AGE_RECIPIENT has no valid age recipient (age1… or ssh-ed25519 …, comma-separated)." >&2; exit 2; }
        echo "Backups encrypted with age for $$(($$# / 2)) recipient(s), the master key included."
      else
        echo "Warning: backups are NOT encrypted; set TAMANDUA_BACKUP_AGE_RECIPIENT before copying them offsite (docs/deploy-vps.md#backups)." >&2
      fi

      # `set -e` doesn't apply inside `if ! backup`: every step stops the backup on its own.
      backup() {
        stamp=$$(date -u +%Y%m%d-%H%M%S)
        partial="/backups/.auto-$$stamp.partial"
        rm -rf "$$partial" && mkdir -m 700 "$$partial" || return 1
        pg_dump -Fc -f "$$partial/database.dump" || return 1
        tar czf "$$partial/data.tgz" -C /source --exclude=data/feeds --exclude=data/trivy-cache --exclude=data/grype-cache \
          --exclude=data/work --exclude=data/tmp data || return 1
        if [ $$# -gt 0 ]; then
          if [ -d /source/config ]; then tar czf "$$partial/config.tgz" -C /source config || return 1; fi
          for file in "$$partial"/*; do
            age "$$@" -o "$$file.age" "$$file" && rm -f "$$file" || return 1
          done
        elif [ -r /source/config/master.key ]; then
          tr -d ' \r\n' < /source/config/master.key | sha256sum | cut -d' ' -f1 > "$$partial/master-key.sha256" || return 1
        fi
        chmod 600 "$$partial"/* && mv "$$partial" "/backups/auto-$$stamp" || return 1
        echo "$$(date -u +%FT%TZ) backup: auto-$$stamp"
        find /backups -mindepth 1 -maxdepth 1 -type d -name 'auto-*' -mtime +"$$keep" -print -exec rm -rf {} + | sed 's/^/pruned: /'
      }

      trap 'exit 0' TERM INT
      umask 077
      while :; do
        if ! backup "$$@"; then
          echo "$$(date -u +%FT%TZ) backup FAILED: see the lines above; retrying in 1 hour" >&2
          rm -rf /backups/.auto-*.partial
          sleep 3600 & wait $$!
          continue
        fi
        sleep $$((interval * 3600)) & wait $$!
      done

networks:
  # PostgreSQL's only network, with no way out. The api and the worker also sit on `default` for their outbound calls.
  db:
    internal: true
  # Caddy ↔ api only.
  edge: {}

volumes:
  tamandua-pg:
  tamandua-data:
  caddy-data:
  caddy-config:
