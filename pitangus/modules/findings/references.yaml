# OWASP guidance for findings: which OWASP page explains each kind of finding (findings/references.py).
#
# Links only: the pages are CC BY-SA and their text is never copied here or into a finding. Every URL was checked
# against the published indexes when this file was last reviewed (`reviewed`); tests/test_finding_references.py
# checks the shape, that every CWE our rules and engines emit resolves or is listed under `unmapped`, and that every
# page is used.
#
# Sources:
#   - OWASP Cheat Sheet Series, alphabetical index: https://cheatsheetseries.owasp.org/index.html
#   - OWASP Top 10:2025, each category's "Mapped CWEs" list: https://top10.owasp.org/2025/
#   - OWASP API Security Top 10 2023: https://api-security.owasp.org/editions/2023/en/0x11-t10/
#   - OWASP Web Security Testing Guide v4.2 (stable test ids): https://wstg.owasp.org/v4.2/
#
# Order of a finding's guidance: its rule (tool + rule id), its framework or file; otherwise its CWEs (code and web
# findings only: a CWE says little about a pipeline or a Terraform file) or its scanner; last, its Top 10 category.

version: 1
reviewed: "2026-10-10"

