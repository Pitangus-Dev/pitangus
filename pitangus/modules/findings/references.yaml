# CWEs our engines emit that no OWASP page explains well enough to link: the finding keeps its CWE and Top 10 links,
# and the rule's own guidance. Each with why.
unmapped:
  377: insecure temporary file; no OWASP cheat sheet covers it
  670: always-incorrect control flow (a pipeline condition); the rule's own documentation is the guidance
  697: incorrect comparison (a pipeline condition); the rule's own documentation is the guidance
  1188: insecure default; too broad to point at one page, the rule's own documentation is the guidance

# Rule families: tool → rule id → pages. A trailing `*` matches a prefix. A ZAP alert variant ("10035-1") and a nuclei
# matcher ("http-missing-security-headers:content-security-policy") fall back to their rule. `_default`: any other
# rule of that tool.
rules:
  zap:
    "10010": [cs-session, wstg-sess-02]          # cookie without HttpOnly
    "10011": [cs-session, wstg-sess-02]          # cookie without Secure
    "10054": [cs-session, wstg-sess-02]          # cookie without SameSite
    "10029": [cs-session, wstg-sess-02]          # cookie poisoning
    "90033": [cs-session, wstg-sess-02]          # loosely scoped cookie
    "10015": [cs-http-headers, wstg-athn-06]     # cache-control
    "10019": [cs-http-headers]                   # content-type missing
    "10020": [cs-clickjacking, wstg-clnt-09]     # anti-clickjacking header
    "10021": [cs-http-headers]                   # X-Content-Type-Options
    "10035": [cs-hsts, wstg-conf-07]             # HSTS
    "10036": [cs-http-headers, wstg-info-02]     # Server header version
    "10037": [cs-http-headers, wstg-info-02]     # X-Powered-By
    "10039": [cs-http-headers, wstg-info-02]     # X-Backend-Server
    "10061": [cs-http-headers, wstg-info-02]     # X-AspNet-Version
    "10052": [cs-http-headers, wstg-info-02]     # X-ChromeLogger-Data
    "10056": [cs-http-headers, wstg-info-02]     # X-Debug-Token
    "10027": [wstg-info-05]                      # suspicious comments
    "10096": [wstg-info-05]                      # timestamp disclosure
    "10038": [cs-csp]                            # CSP missing
    "10055": [cs-csp]                            # CSP weak directive
    "10063": [cs-http-headers]                   # Permissions-Policy
    "10098": [cs-html5, wstg-clnt-07]            # CORS
    "90004": [cs-xs-leaks, cs-http-headers]      # cross-origin isolation headers
    "10017": [cs-third-party-js]                 # cross-domain script inclusion
    "90003": [cs-third-party-js]                 # subresource integrity missing
    "10202": [cs-csrf, wstg-sess-05]             # absence of anti-CSRF tokens
    "40012": [cs-xss, wstg-inpv-01]              # reflected XSS
    "40014": [cs-xss, wstg-inpv-02]              # persistent XSS
    "40026": [cs-dom-xss]                        # DOM XSS
    "40018": [cs-sql-injection, cs-query-parameterization, wstg-inpv-05]  # SQL injection
    "40034": [wstg-conf-04]                      # .env leak
    "40035": [wstg-conf-04]                      # hidden files
    "40046": [cs-ssrf, wstg-inpv-19]             # SSRF
    "90019": [cs-injection, wstg-inpv-11]        # server-side code injection
    "90020": [cs-os-command, wstg-inpv-12]       # remote OS command injection
    "90023": [cs-xxe, wstg-inpv-07]              # XXE
    "6": [cs-input-validation, wstg-athz-01]     # path traversal
  nuclei:
    http-missing-security-headers: [cs-http-headers]
    "http-missing-security-headers:content-security-policy": [cs-csp]
    "http-missing-security-headers:strict-transport-security": [cs-hsts, wstg-conf-07]
    "http-missing-security-headers:x-frame-options": [cs-clickjacking, wstg-clnt-09]
    weak-hsts-detect: [cs-hsts, wstg-conf-07]
    missing-cookie-samesite-strict: [cs-session, wstg-sess-02]
    git-config: [wstg-conf-04]
    laravel-env: [wstg-conf-04]
    deprecated-tls: [cs-tls, wstg-cryp-01]
    weak-cipher-suites: [cs-tls-cipher, cs-tls, wstg-cryp-01]
    insecure-cipher-suite-detect: [cs-tls-cipher, cs-tls, wstg-cryp-01]
    expired-ssl: [cs-tls, wstg-cryp-01]
    self-signed-ssl: [cs-tls, wstg-cryp-01]
    untrusted-root-certificate: [cs-tls, wstg-cryp-01]
    mismatched-ssl-certificate: [cs-tls, wstg-cryp-01]
    revoked-ssl-certificate: [cs-tls, wstg-cryp-01]
    # Pitangus' own templates (pitangus/modules/scanning/rules/nuclei).
    pitangus-directory-listing: [wstg-conf-04]
    pitangus-json-credentials: [cs-secrets, wstg-info-05]
    pitangus-sensitive-paths: [wstg-conf-04]
    pitangus-api-description: [cs-rest]
    pitangus-metadata-files: [wstg-conf-04]
  testssl:
    HSTS*: [cs-hsts, wstg-conf-07]
    security_headers: [cs-http-headers]
    cipherlist_*: [cs-tls-cipher, cs-tls, wstg-cryp-01]
    _default: [cs-tls, wstg-cryp-01]
  zizmor:
    template-injection: [cs-github-actions, cs-ci-cd]
    github-env: [cs-github-actions, cs-ci-cd]
    unpinned-uses: [cs-github-actions, cs-supply-chain]
    unpinned-images: [cs-github-actions, cs-supply-chain]
    forbidden-uses: [cs-github-actions, cs-supply-chain]
    hardcoded-container-credentials: [cs-secrets, cs-github-actions]
    secrets-inherit: [cs-secrets, cs-github-actions]
    overprovisioned-secrets: [cs-secrets, cs-github-actions]
    unredacted-secrets: [cs-secrets, cs-github-actions]
    cache-poisoning: [cs-github-actions, cs-ci-cd]
    _default: [cs-github-actions, cs-ci-cd]
  pitangus:
    IMG-ENV-SECRET: [cs-secrets, cs-docker]
    IMG-BUILD-SECRET: [cs-secrets, cs-docker]
    IMG-BUILD-URL-CREDENTIAL: [cs-secrets, cs-docker]
    IMG-*: [cs-docker]

# The framework an IaC or pipeline finding names (Checkov's, zizmor's).
frameworks:
  Dockerfile: [cs-docker]
  Kubernetes: [cs-kubernetes]
  Helm: [cs-kubernetes]
  Kustomize: [cs-kubernetes]
  GitHub Actions: [cs-github-actions, cs-ci-cd]
  GitLab CI: [cs-ci-cd]
  Bitbucket Pipelines: [cs-ci-cd]
  Azure Pipelines: [cs-ci-cd]
  CircleCI: [cs-ci-cd]
  Argo Workflows: [cs-ci-cd]
  Terraform: [cs-iac]
  CloudFormation: [cs-iac]
  ARM: [cs-iac]
  Bicep: [cs-iac]
  Serverless: [cs-iac]
  Ansible: [cs-iac]
  OpenAPI: [cs-rest]

# By the file, for IaC and pipeline findings without a framework (Trivy's): a regular expression on the path.
paths:
  - {pattern: '(^|/)(Dockerfile|Containerfile)[^/]*$|\.dockerfile$|^image-(config|history)(/|$)', pages: [cs-docker]}
  - {pattern: '(^|/)\.github/workflows/', pages: [cs-github-actions, cs-ci-cd]}
  - {pattern: '(^|/)\.gitlab-ci\.ya?ml$', pages: [cs-ci-cd]}
  - {pattern: '\.(tf|tfvars|hcl)$', pages: [cs-iac]}

# Last, by scanner; `cwe: true` uses the CWE pages above (code and web findings).
scanners:
  sast: {cwe: true, pages: []}
  dast: {cwe: true, pages: []}
  secrets: {cwe: false, pages: [cs-secrets]}
  sca: {cwe: false, pages: [cs-vulnerable-dependencies, cs-supply-chain]}
  iac: {cwe: false, pages: [cs-iac]}
  cicd: {cwe: false, pages: [cs-ci-cd]}
