id: pitangus-json-credentials

info:
  name: Credential or secret in a JSON response
  author: pitangus
  severity: high
  description: |
    A JSON response carries a field named like a credential (password, secret, API key, token) with a value that
    looks real: not empty, not a type name or a placeholder. Anyone who can request this URL can read it.
  remediation: |
    Remove the field from the response, or replace its value with a mask, and rotate the credential if it was real.
    Responses should only carry the data the client needs. See the referenced OWASP pages for this check.
  reference:
    - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/01-Information_Gathering/05-Review_Web_Page_Content_for_Information_Leakage
    - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
    pitangus-name-es: Credencial o secreto en una respuesta JSON
    pitangus-description-es: |
      Una respuesta JSON trae un campo con nombre de credencial (contraseña, secreto, clave de API, token) y un valor
      que parece real: no está vacío, no es un nombre de tipo ni un marcador. Cualquiera que pida esta URL puede leerlo.
    pitangus-remediation-es: |
      Quita el campo de la respuesta o enmascara su valor, y rota la credencial si era real. Las respuestas deben
      traer solo los datos que el cliente necesita. Consulta las páginas de OWASP referenciadas para este control.
  tags: exposure,token,pitangus

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: regex
        part: header
        regex:
          - '(?im)^content-type:\s*application/(?:[a-z0-9.+-]*\+)?json'

      # The value has six characters or more, with a digit or a symbol a type name, a placeholder or a mask never has.
      - type: regex
        part: body
        regex:
          - '"(?i:password|passwd|pwd|secret|client_secret|api[_-]?key|access[_-]?token|auth[_-]?token|refresh[_-]?token|token|private[_-]?key)"\s*:\s*"(?:[^"\s]{5,}[0-9+/=!@#$%][^"\s]*|[^"\s]*[0-9+/=!@#$%][^"\s]{5,})"'

      # A schema or an API description names these fields without holding values.
      - type: regex
        part: body
        negative: true
        regex:
          - '"\$schema"\s*:'
          - '"(?:openapi|swagger)"\s*:\s*"[0-9]'
          - '"properties"\s*:\s*\{'
        condition: or
