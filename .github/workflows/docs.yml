name: Documentation

on:
  pull_request:
    paths:
      - '.github/CONTRIBUTING*.md'
      - '.github/workflows/docs.yml'
      - 'docs/**'
      - 'docs-site/**'
      - 'pitangus/shared/settings.py'
      - 'web/src/shared/api/openapi.json'
  push:
    branches: [main]
    paths:
      - '.github/CONTRIBUTING*.md'
      - '.github/workflows/docs.yml'
      - 'docs/**'
      - 'docs-site/**'
      - 'pitangus/shared/settings.py'
      - 'web/src/shared/api/openapi.json'
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Types, sources, links and build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # each page's "Last updated" date comes from its source file's history
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false  # nothing restored from a cache into the build
      # pnpm at the exact version (and hash) of docs-site/package.json's packageManager, through Node's corepack.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: docs-site
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      - run: pnpm run build
        working-directory: docs-site
        env:
          SITE_URL: https://docs.pitangus.dev
          BASE_PATH: /
