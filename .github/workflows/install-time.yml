# How long a first install takes on a clean machine, done exactly as the README's quick start says: clone a release,
# `make setup` (with PREBUILT=1: the published images; without it: built from source) and `make up`, until the panel
# answers and every engine image is in place. Each GitHub-hosted runner is a fresh VM with nothing cached, so this is a
# first install; its network is a datacenter's, faster than most homes. Manual only.
name: Install time

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag to install (empty: the latest)"
        required: false
        default: ""

permissions: {}

concurrency:
  group: install-time
  cancel-in-progress: false

jobs:
  measure:
    name: Install (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mode: [prebuilt, build]
    steps:
      - name: Install from scratch and time each step
        env:
          MODE: ${{ matrix.mode }}
          REF: ${{ inputs.ref }}
          REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -eu
          ref="${REF:-$(git ls-remote --tags --refs "$REPOSITORY" 'v*' | awk -F/ '{print $3}' | sort -V | tail -n 1)}"
          now() { date +%s; }
          start=$(now)
          git clone --quiet --depth 1 --branch "$ref" "$REPOSITORY.git" tamandua
          cloned=$(now)
          cd tamandua
          if [ "$MODE" = prebuilt ]; then make setup PREBUILT=1; else make setup; fi
          make up
          ready=$(now)
          curl -fsS http://127.0.0.1:8766/api/health
          echo
          docker compose ps --format '{{.Name}} {{.Status}}'
          clock() { printf '%dm %02ds' $(($1 / 60)) $(($1 % 60)); }
          {
            echo "### Install $ref ($MODE)"
            echo
            echo "| Step | Time |"
            echo "| --- | --- |"
            echo "| git clone | $(clock $((cloned - start))) |"
            echo "| make setup + make up (panel answering, engines in place) | $(clock $((ready - cloned))) |"
            echo "| **Total** | **$(clock $((ready - start)))** |"
            echo
            echo "Runner: $(nproc) CPUs, $(free -g | awk '/^Mem:/ {print $2}') GB RAM, $(docker --version)."
          } >> "$GITHUB_STEP_SUMMARY"
