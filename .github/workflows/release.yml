# Published images for self-hosting, on every version tag (v0.12, v0.12.1…):
#
#   ghcr.io/<owner>/pitangus:<version>              panel, API and worker (docker/app/Dockerfile)
#   ghcr.io/<owner>/pitangus-worker:<version>       worker with the engines inside, no Docker socket (target worker-standalone)
#   ghcr.io/<owner>/pitangus-opengrep:<engine>      SAST engine (docker/engines/opengrep/Dockerfile)
#
# linux/amd64 and linux/arm64, with an SBOM and SLSA provenance attached by BuildKit, and signed with cosign keyless
# (GitHub OIDC: no key to store or leak). Verify with `make verify-images` or the command in docs/deploy-vps.md.
#
# The tag must match pitangus/version.py (v0.12 or v0.12.<patch>): the compose files of that checkout ask for that tag.
# A patch tag also moves the <major.minor> tag, which is the one compose pulls.
# After the images are signed, the `assets` job attaches to the GitHub release of the tag what lets anyone check them
# without pulling: each image's SBOM, their SLSA provenance and a manifest of the signed digests, itself signed with
# cosign (keyless, the same identity). It waits for the release, which a maintainer creates by hand, and never creates it.
# Once published, `make pin-hook` (cosign) checks the worker's signature and pins the pre-commit hook
# (hooks/pitangus-docker) to its digest: commit that in a PR, like any change to main.
# Actions pinned by commit; no cache (a release is built from scratch); only this job can write packages, and only
# from the `release` environment.
# First release only: GHCR creates both packages as private; make them public (package settings → visibility) so
# servers can pull them without credentials.
name: Release images

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Build, push and sign (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Only main and v* tags can deploy to this environment; v* tags can't be moved or deleted (repository ruleset).
    environment: release
    permissions:
      contents: read
      packages: write   # push to ghcr.io/<owner>
      id-token: write   # cosign keyless: the workflow's OIDC identity signs
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: pitangus
            context: .
            file: docker/app/Dockerfile
            target: app   # not the last stage (worker-standalone, whose command is the worker)
          - image: pitangus-worker
            context: .
            file: docker/app/Dockerfile
            target: worker-standalone
          - image: pitangus-opengrep
            context: docker/engines/opengrep
            file: docker/engines/opengrep/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Name and tags
        id: meta
        env:
          IMAGE: ${{ matrix.image }}
          OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}  # never interpolated directly into the script
        run: |
          version="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' pitangus/version.py)"
          if ! printf '%s' "$REF_NAME" | grep -Eq "^v${version//./\\.}(\.[0-9]+)?$"; then
            echo "::error::Tag $REF_NAME does not match pitangus/version.py ($version): use v$version or v$version.<patch>."
            exit 1
          fi
          name="ghcr.io/${OWNER,,}/$IMAGE"
          if [ "$IMAGE" = pitangus ] || [ "$IMAGE" = pitangus-worker ]; then
            tags="$name:$version"
            [ "$REF_NAME" != "v$version" ] && tags="$tags,$name:${REF_NAME#v}"
            build_args="VERSION=${REF_NAME#v}"
          else
            engine="$(sed -n 's/^ARG OPENGREP_VERSION=//p' docker/engines/opengrep/Dockerfile)"
            tags="$name:$engine"
            build_args=""
          fi
          {
            echo "name=$name"
            echo "tags=$tags"
            echo "build_args=$build_args"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        with:
          platforms: arm64
          # Privileged, in a job that can push and sign: pinned by digest, not :latest.
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Checked before anything is pushed: an image with a critical vulnerability that already has a fix isn't
      # published (rebuild it with the fix instead). One architecture is enough, the packages are the same; the push
      # below reuses this build's layers from the same builder. Trivy is the same pinned image the scans use.
      - name: Build for the check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          build-args: ${{ steps.meta.outputs.build_args }}
          tags: pitangus-check:${{ matrix.image }}
          pull: true
          load: true

      - name: No critical vulnerability with a fix
        env:
          IMAGE: pitangus-check:${{ matrix.image }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --quiet --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE"

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-args: ${{ steps.meta.outputs.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max
          pull: true
          push: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign (keyless) and check the signature
        env:
          NAME: ${{ steps.meta.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          # By digest, never by tag: the signature covers exactly what was pushed (the index and its platforms).
          cosign sign --yes --recursive "$NAME@$DIGEST"
          cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$IDENTITY" "$NAME@$DIGEST" > /dev/null
          echo "### $NAME@$DIGEST" >> "$GITHUB_STEP_SUMMARY"

      # The digest that was signed, for the `assets` job: it never resolves a tag again.
      - name: Keep the signed digest for the release assets
        env:
          NAME: ${{ steps.meta.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ matrix.image }}
        run: |
          mkdir digest
          printf '%s@%s\n' "$NAME" "$DIGEST" > "digest/$IMAGE.ref"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: image-${{ matrix.image }}
          path: digest/
          if-no-files-found: error
          retention-days: 14

  # Reads what the images job published (nothing is built or pushed here) and attaches it to the release of the tag.
  # Only this job writes to the release; only its signing step uses the OIDC identity.
  assets:
    name: Attach SBOMs, provenance and a signed manifest to the release
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write   # gh release upload
      id-token: write   # cosign keyless: signs the manifest with the workflow's OIDC identity
    env:
      IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true
          path: digests

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # The digests came from the previous job; check their signatures again before putting them in a manifest.
      - name: Check the images' signatures
        run: |
          for file in digests/*.ref; do
            cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "$IDENTITY" "$(cat "$file")" > /dev/null
          done

      - name: SBOMs, provenance and manifest
        env:
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          refs=()
          for file in digests/*.ref; do refs+=("$(cat "$file")"); done
          sh scripts/release-assets.sh assets "${REF_NAME#v}" "${refs[@]}"

      # Keyless, like the images: the signature binds the manifest (and through its SHA-256 list, every other file) to
      # this workflow's identity. The bundle holds the certificate and the transparency-log entry.
      - name: Sign the manifest (keyless) and check the signature
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          manifest="assets/pitangus-${REF_NAME#v}-images.json"
          cosign sign-blob --yes --bundle "$manifest.sigstore.json" "$manifest"
          cosign verify-blob --bundle "$manifest.sigstore.json" --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$IDENTITY" "$manifest"
          ls -l assets

      # A maintainer creates the release by hand a minute or two after pushing the tag, and the images take longer
      # than that to build: wait for it, up to 15 minutes. The release is never created from here.
      - name: Wait for the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          deadline=$((SECONDS + 900))
          until out=$(gh release view "$TAG" --repo "$REPO" 2>&1); do
            case $out in
              *"release not found"*) ;;
              *) echo "::error::Could not look up the release $TAG: $out"; exit 1 ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::The release $TAG did not exist after 15 minutes. Create the release and re-run this job: the assets are generated again."
              exit 1
            fi
            echo "The release $TAG doesn't exist yet; trying again in 20 s."
            sleep 20
          done

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" assets/* --clobber --repo "$REPO"
