name: Documentation (Cloudflare)

# Fallback for publishing docs.pitangus.dev to Cloudflare Workers from GitHub Actions, for when Workers Builds (the
# Cloudflare dashboard's Git integration, the preferred route: docs-site/README.md) can't be used. Manual only: it does
# nothing until the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets exist and someone runs it.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish to Cloudflare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    environment:
      name: docs-cloudflare
      url: https://docs.pitangus.dev/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # each page's "Last updated" date comes from its source file's history
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false  # a cache restored into the job that holds the Cloudflare token could be poisoned
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: docs-site
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      - run: pnpm run build
        working-directory: docs-site
        env:
          SITE_URL: https://docs.pitangus.dev
          BASE_PATH: /
      # Wrangler is installed apart from docs-site, whose pnpm supply-chain rules (no dependency build scripts) it would
      # trip: only the config and the built site go in.
      - run: |
          mkdir docs-deploy
          cp docs-site/wrangler.jsonc docs-deploy/
          cp -R docs-site/dist docs-deploy/dist
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0  # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.146.0
          packageManager: npm
          workingDirectory: docs-deploy
          command: deploy
