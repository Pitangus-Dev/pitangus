# Weekly version updates, grouped so a week brings a handful of pull requests, and only for releases at least a week
# old (cooldown): a hijacked release is usually caught and yanked within days. Security updates ignore the cooldown.
#
# Not covered here (keep them fresh by hand):
# - the engine images in pitangus/modules/scanning/engines.py (IMAGES) and their copies in docker/app/Dockerfile,
#   pinned by digest without a tag: tests/test_packaging.py keeps both in step;
# - docker/checkov: its version must match IMAGES["checkov"];
# - the postgres and caddy digests repeated in the compose files, scripts/test-db.sh and the CI service.
# Dependabot bumps only the packages named in requirements*.in; `make lock ARGS=--upgrade` refreshes the transitive
# ones (docs/development.md).
version: 2
updates:
  # .github/workflows and the composite action.yml at the root.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Base images. One pull request per image across both Dockerfiles (debian:12-slim is in both). The image keeps its
  # Python 3.12 (the locks are compiled for it), Node 22 and Debian 12: only digests and patch versions move.
  - package-ecosystem: docker
    directories:
      - /docker/app
      - /docker/engines/opengrep
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      base-images:
        patterns: ["*"]
        group-by: dependency-name
    ignore:
      # The engines: their digests must move together with IMAGES (see above).
      - dependency-name: "*trivy"
      - dependency-name: "*osv-scanner"
      - dependency-name: "*gitleaks"
      - dependency-name: "*grype"
      - dependency-name: "*zizmor"
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: debian
        update-types: ["version-update:semver-major"]

  # pip-compile layout: Dependabot edits requirements*.in and recompiles requirements*.txt with the options in their
  # header (hashes included), in Python 3.12 as the header says.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    # The panel is built with Node 22 (CI and the image): its types follow that major, not the newest one.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      web:
        patterns: ["*"]
        update-types: ["minor", "patch"]
