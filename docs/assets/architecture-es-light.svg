  <text x="268" y="484" class="detail">Grype (opcional)</text>
  <rect x="480.5" y="424.5" width="207" height="109" rx="6" class="node"/>
  <text x="492" y="448" class="title">Sitios y APIs</text>
  <text x="492" y="466" class="detail">Comprobación de exposición:</text>
  <text x="492" y="484" class="detail">httpx, testssl.sh, nuclei</text>
  <text x="492" y="502" class="detail">Completo (experimental):</text>
  <text x="492" y="520" class="detail">ZAP, katana, subfinder</text>
  <path d="M360 566 L360 612" class="edge" marker-end="url(#head)"/>
  <text x="372" y="595" class="note">HTTPS saliente desde el API y el worker</text>
  <rect x="0.5" y="614.5" width="719" height="244" rx="8" class="group"/>
  <text x="16" y="640" class="title group-title">Conexiones salientes</text>
  <text x="16" y="658" class="note">Pitangus consulta GitHub: ningún webhook tiene que llegar a tu servidor</text>
  <rect x="16.5" y="678.5" width="335" height="73" rx="6" class="node"/>
  <text x="28" y="702" class="title">API de GitHub</text>
  <text x="28" y="720" class="detail">App o token: copias de los repositorios,</text>
  <text x="28" y="738" class="detail">comentarios y estados en pull requests</text>
  <rect x="368.5" y="678.5" width="335" height="73" rx="6" class="node"/>
  <text x="380" y="702" class="title">Datos de avisos</text>
  <text x="380" y="720" class="detail">NVD, CISA KEV, EPSS, OSV, EUVD</text>
  <text x="380" y="738" class="detail">y las bases de vulnerabilidades de los motores</text>
  <rect x="16.5" y="768.5" width="335" height="73" rx="6" class="node"/>
  <text x="28" y="792" class="title">Objetivos de análisis</text>
  <text x="28" y="810" class="detail">Registros de imágenes, y los sitios y APIs</text>
  <text x="28" y="828" class="detail">de los dominios que verificaste</text>
  <rect x="368.5" y="768.5" width="335" height="73" rx="6" class="node"/>
  <text x="380" y="792" class="title">Avisos e incidencias</text>
  <text x="380" y="810" class="detail">Jira, Slack, Teams y webhooks</text>
</svg>
