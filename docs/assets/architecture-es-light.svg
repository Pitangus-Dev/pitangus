<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 859" width="720" height="859" role="img" aria-labelledby="title desc" lang="es">
  <title id="title">Arquitectura de Pitangus</title>
  <desc id="desc">El navegador llega al API por HTTPS, a través de Caddy en un servidor, o por loopback. En tu servidor, el API y uno o varios workers comparten PostgreSQL, que guarda ejecuciones, hallazgos, la cola, la configuración y los secretos cifrados; la clave maestra solo es un archivo, config/master.key, si PITANGUS_MASTER_KEY no está definida. El worker lanza los motores por el socket de Docker o los ejecuta dentro de la imagen worker-standalone, con una copia en solo lectura, sin capacidades y con límites de memoria, CPU y procesos: Trivy, OSV-Scanner, Betterleaks, zizmor y Opengrep con 66 reglas para el código y las dependencias, y Checkov si se activa; Trivy para las imágenes de contenedor, y Grype si se activa; para sitios y APIs, httpx, testssl.sh y nuclei en la comprobación de exposición, y ZAP, katana y subfinder en el análisis completo, que es experimental. El API y el worker abren conexiones HTTPS salientes al API de GitHub, a los datos de avisos (NVD, CISA KEV, EPSS, OSV, EUVD y las bases de los motores), a los registros de imágenes y los sitios verificados, y a Jira, Slack, Teams y webhooks.</desc>
  <style>
    text { font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #3D434A; }
    .title { font-size: 14px; font-weight: 500; fill: #16181B; }
    .group-title { font-weight: 600; }
    .detail { font-size: 13px; }
    .note { font-size: 12px; fill: #5C636B; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .node { fill: #FFFFFF; stroke: #80868E; stroke-width: 1; }
    .node.optional { stroke-dasharray: 4 3; }
    .group { fill: none; stroke: #DADDE1; stroke-width: 1; }
    .group.filled { fill: #F5F6F7; }
    .edge { fill: none; stroke: #5C636B; stroke-width: 1.25; }
    .edge.optional { stroke-dasharray: 4 3; }
  </style>
  <defs>
