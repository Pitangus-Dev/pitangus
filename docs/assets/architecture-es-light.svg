  <text x="28" y="42" class="detail">Panel React</text>
  <path d="M112 56 L112 146" class="edge" marker-end="url(#head)"/>
  <text x="124" y="86" class="note">HTTPS (Caddy en un servidor) o loopback</text>
  <rect x="16.5" y="148.5" width="191" height="73" rx="6" class="node"/>
  <text x="28" y="172" class="title">API</text>
  <text x="28" y="190" class="detail">FastAPI y el panel</text>
  <text x="28" y="208" class="detail">Sin acceso a Docker</text>
  <rect x="240.5" y="148.5" width="239" height="73" rx="6" class="node"/>
  <text x="252" y="172" class="title">PostgreSQL</text>
  <text x="252" y="190" class="detail">Ejecuciones, hallazgos, cola,</text>
  <text x="252" y="208" class="detail">configuración, secretos cifrados</text>
  <rect x="512.5" y="148.5" width="191" height="73" rx="6" class="node"/>
  <text x="524" y="172" class="title">Worker, uno o varios</text>
  <text x="524" y="190" class="detail">Cola de análisis y</text>
  <text x="524" y="208" class="detail">tareas periódicas</text>
  <path d="M208 185 L240 185" class="edge"/>
  <path d="M512 185 L480 185" class="edge"/>
  <path d="M360 222 L360 246" class="edge optional"/>
