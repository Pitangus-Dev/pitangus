# Run from the published images (built and signed by .github/workflows/release.yml) instead of building on the server.
# An overlay on compose.yaml (usually with compose.prod.yaml too):
#
#   make setup DOMAIN=pitangus.example.com PREBUILT=1   # PITANGUS_IMAGE=ghcr.io/pitangus-dev/pitangus
#
# The tag is the version of the code you checked out (PITANGUS_VERSION, from pitangus/version.py through make), so
# the compose files, rules and images always match. With cosign installed, `make up` checks the signatures first
# (`make verify-images`) and pins the checked digest in .env (PITANGUS_IMAGE_TAG=0.12@sha256:…): every later start,
# `docker compose up` included, runs exactly that image; `make update` checks and pins the new release.
#
# The Opengrep engine is published as <PITANGUS_IMAGE>-opengrep. The worker starts it by its local name
# (localhost/pitangus/opengrep:<version>), so the `opengrep` service gives the published image that name: a one-line build
# with no steps of its own.

# `build: !reset` has to sit in each service: inside a merged anchor Compose doesn't apply it.
x-published: &published
  image: "${PITANGUS_IMAGE:?PITANGUS_IMAGE is missing in .env (e.g. ghcr.io/pitangus-dev/pitangus)}:${PITANGUS_IMAGE_TAG:-${PITANGUS_VERSION:-0.12}}"
  pull_policy: missing

services:
  api:
    <<: *published
    build: !reset null

  worker:
    <<: *published
    build: !reset null

  opengrep:
    build: !override
      context: docker/engines/opengrep
      dockerfile_inline: |
        FROM ${PITANGUS_IMAGE:?PITANGUS_IMAGE is missing in .env}-opengrep:1.30.0
