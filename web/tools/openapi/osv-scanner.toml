# OSV-Scanner's configuration for this folder (pnpm-lock.yaml: openapi-typescript, which generates
# web/src/shared/api/schema.d.ts from the API's OpenAPI document), read by tools that scan this repository, such as
# OpenSSF Scorecard and CI's "Pitangus on itself", which lists what this file hides under Excluded. Each entry says why
# the advisory doesn't apply and when to look again.

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"  # also CVE-2026-118764: denial of service in minimatch via globparts amplification
reason = "The amplification needs a glob pattern an attacker controls. minimatch is here only through @redocly/openapi-core, which openapi-typescript uses to read this repository's own OpenAPI document, and the patterns it expands come from Redocly's own configuration: nothing outside the repository reaches them. It runs during `make openapi` and in CI, never in a release, an image or the server. There is also no version to move to: @redocly/openapi-core 1.34.20 pins minimatch 5.1.9 exactly, the 5.x line ends there, and the fix is 11.0.1 (five majors up, with a different module shape) -- Dependabot's own security update for this lockfile failed for that reason. Look again when openapi-typescript brings a @redocly/openapi-core that leaves minimatch 5 behind."
