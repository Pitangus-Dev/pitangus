# Render Blueprint: the API with the panel (web service), the worker with the engines inside (background worker, no
# Docker socket) and PostgreSQL. New Blueprint → this repository → fill in PITANGUS_PUBLIC_URL when asked.
# It uses the published images: it needs a released version (see docs/deploy.md). Not yet tried on Render.
databases:
  - name: pitangus-db
    databaseName: pitangus
    user: pitangus
    # Only Render's private network: without this a new database accepts connections from any IP that has the password.
    ipAllowList: []

services:
  - type: web
    name: pitangus-api
    runtime: image
    image:
      url: ghcr.io/pitangus-dev/pitangus:0.12
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8766"
      - key: PITANGUS_BIND
        value: 0.0.0.0
      - key: PITANGUS_EMBEDDED_WORKER
        value: "0"
      - key: PITANGUS_DATABASE_URL
        fromDatabase:
          name: pitangus-db
          property: connectionString
      # 32 random bytes in base64: exactly the master key's format. Keep a copy apart: it decrypts every secret.
      - key: PITANGUS_MASTER_KEY
        generateValue: true
      # https://<your service>.onrender.com, or your own domain
      - key: PITANGUS_PUBLIC_URL
        sync: false
      # Render's proxy is the only way in: its X-Forwarded-For is believed (sign-in throttling needs the real address).
      - key: PITANGUS_FORWARDED_ALLOW_IPS
        value: "*"
      - key: PITANGUS_LOG_FORMAT
        value: json

  - type: worker
    name: pitangus-worker
    runtime: image
    image:
      url: ghcr.io/pitangus-dev/pitangus-worker:0.12
    envVars:
      - key: PITANGUS_DATABASE_URL
        fromDatabase:
          name: pitangus-db
          property: connectionString
      - key: PITANGUS_MASTER_KEY
        fromService:
          type: web
          name: pitangus-api
          envVarKey: PITANGUS_MASTER_KEY
      - key: PITANGUS_PUBLIC_URL
        fromService:
          type: web
          name: pitangus-api
          envVarKey: PITANGUS_PUBLIC_URL
      - key: PITANGUS_LOG_FORMAT
        value: json
