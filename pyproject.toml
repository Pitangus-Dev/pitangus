[project]
name = "pitangus"
dynamic = ["version"]
description = "Seguridad de aplicaciones autoalojada: qué corregir primero, cómo, y la evidencia para el auditor."
requires-python = ">=3.12"
license = "AGPL-3.0-only"

[tool.setuptools.dynamic]
version = { attr = "pitangus.version.VERSION" }

# Lint (`make lint-py`, CI): rules that find bugs rather than style.
[tool.ruff]
target-version = "py312"
cache-dir = ".cache/ruff"  # every tool cache in one ignored folder, not one per tool at the root
extend-exclude = ["web", "docs", "deploy", "skills"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "C4"]
# E731: short named lambdas read fine. B905: several zips pair a list with its own tail on purpose.
ignore = ["E731", "B905"]

[tool.ruff.lint.per-file-ignores]
"pitangus/app/api/*" = ["B008"]  # FastAPI's Depends() and Query() are declared as defaults

# Types (`make typecheck`, CI). A ratchet: every module type-checks except the ones listed below, which had errors
# when the check arrived. Fix one, take it off the list; the list only shrinks.
[tool.mypy]
python_version = "3.12"
cache_dir = ".cache/mypy"
files = ["pitangus"]
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "pitangus.app.alembic.env",
    "pitangus.app.api.assets",
    "pitangus.app.api.auth",
    "pitangus.app.api.compliance",
    "pitangus.app.api.deps",
    "pitangus.app.api.findings",
    "pitangus.app.api.images",
    "pitangus.app.api.notifications",
    "pitangus.app.api.onboarding",
    "pitangus.app.api.pullrequests",
    "pitangus.app.api.reporting",
    "pitangus.app.api.repositories",
    "pitangus.app.api.runs",
    "pitangus.app.api.scanning",
    "pitangus.app.api.sources",
    "pitangus.app.api.threats",
    "pitangus.app.worker",
    "pitangus.cli.main",
    "pitangus.modules.compliance.cra",
    "pitangus.modules.compliance.sbom",
    "pitangus.modules.findings.exclusions",
    "pitangus.modules.findings.registry",
    "pitangus.modules.findings.remediation",
    "pitangus.modules.findings.sla",
    "pitangus.modules.identity.auth",
    "pitangus.modules.integrations.ai_providers",
    "pitangus.modules.integrations.github",
    "pitangus.modules.integrations.jira",
    "pitangus.modules.integrations.notifications",
    "pitangus.modules.intel.advisories",
    "pitangus.modules.intel.cve_db",
    "pitangus.modules.pullrequests.watch",
    "pitangus.modules.reporting.audit",
    "pitangus.modules.reporting.dashboard",
    "pitangus.modules.reporting.design",
    "pitangus.modules.runs.advisory_watch",
    "pitangus.modules.runs.jobs",
    "pitangus.modules.runs.local",
    "pitangus.modules.runs.store",
    "pitangus.modules.scanning.config_engines",
    "pitangus.modules.scanning.engines",
    "pitangus.modules.scanning.image",
    "pitangus.modules.scanning.inventory",
    "pitangus.modules.scanning.plan",
    "pitangus.modules.scanning.repository",
    "pitangus.modules.scanning.secret_rules",
    "pitangus.modules.scanning.unused_deps",
    "pitangus.modules.sources.domains",
    "pitangus.modules.sources.repositories",
    "pitangus.modules.threats.diagram",
    "pitangus.modules.threats.methods",
    "pitangus.modules.threats.model",
    "pitangus.modules.threats.report",
]
ignore_errors = true

# Contratos de arquitectura (import-linter): los comprueba `make arch` y el CI.
[tool.importlinter]
root_packages = ["pitangus"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Capas: la composición usa el negocio; el negocio no conoce la composición; lo compartido no conoce el negocio"
type = "layers"
layers = [
    "pitangus.cli",
    "pitangus.app",
    "pitangus.modules",
    "pitangus.shared",
]

[[tool.importlinter.contracts]]
name = "Contexts: each one imports only the contexts below it; siblings joined by | never import each other"
type = "layers"
containers = ["pitangus.modules"]
exhaustive = true
layers = [
    "compliance | threats",  # consumers
    "reporting",
    "runs",                  # orchestration
    "pullrequests",
    "scanning | findings",   # domain
    "sources",               # base
    "integrations",
    "intel | identity",
]

[[tool.importlinter.contracts]]
name = "El negocio no depende del framework web: FastAPI y Starlette solo en la composición"
type = "forbidden"
source_modules = ["pitangus.modules", "pitangus.shared"]
forbidden_modules = ["fastapi", "starlette", "uvicorn"]
