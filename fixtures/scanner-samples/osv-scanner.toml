id = "GHSA-29mw-wpgm-hmr9"  # lodash 4.17.20, ReDoS (CVE-2020-28500)
reason = "Deliberately vulnerable demo input: `make demo` scans this folder so that this advisory shows up as a finding. Nothing here is installed, built or run: there is no node_modules, and no Pitangus code, image or release uses this package."

