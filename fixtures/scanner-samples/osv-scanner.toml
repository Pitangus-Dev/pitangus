# OSV-Scanner's configuration for this folder, read by tools that scan this whole repository, such as OpenSSF
# Scorecard's Vulnerabilities check (CI's "Pitangus on itself" leaves fixtures/ out altogether). This folder is a
# deliberately vulnerable sample: package.json and package-lock.json pin lodash 4.17.20 and minimatch 3.0.4 so that the
# demo has dependency findings to show. They are never installed or executed, so their advisories are declared here
# instead of being reported against Pitangus.
#
# The demo doesn't read this file: pitangus/app/demo.py copies the sample without it, so `make demo` still reports
# every advisory below as an open finding. An advisory published later for these versions is not listed here and is
# reported until someone adds it, on purpose: each one is looked at once.

